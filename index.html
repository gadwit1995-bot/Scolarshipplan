<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F5FB">
<title>Kyoto Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js" defer></script>
<style>
:root{--primary:#5E5CE6;--primary-soft:#EEEDFD;--bg-outer:#EAE6FD;--bg:#F6F5FB;--card:#fff;--text:#1C1B29;--sub:#7A7891;--line:#ECEAF5;--green:#10B981;--red:#EF4444;--r:18px;--nav-h:64px;--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg-outer)}
body{font-family:-apple-system,BlinkMacSystemFont,"Plus Jakarta Sans","SF Pro Display","Sukhumvit Set","Kanit",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
.app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);padding-bottom:calc(var(--nav-h) + var(--safe-b) + 24px)}
@media(min-width:520px){.app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(94,92,230,.12)}}
.view{display:none}.view.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.top{position:sticky;top:0;z-index:20;background:rgba(246,245,251,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:calc(var(--safe-t) + 12px) 16px 10px}
.top.simple{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.3px}
.top-row{display:flex;align-items:center;justify-content:space-between}
.month-btn{border:0;background:none;font-size:22px;font-weight:800;display:flex;align-items:center;gap:4px;letter-spacing:-.3px}
.month-btn svg{color:var(--sub)}
.top-actions{display:flex;gap:6px;align-items:center}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--text);flex:none}
.pill-btn{border:0;background:var(--primary-soft);color:var(--primary);font-size:13px;font-weight:700;padding:8px 13px;border-radius:999px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:10px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border:0;background:none;font-size:12px;color:var(--sub);font-weight:600}
.wd b{font-size:16px;color:var(--text);width:34px;height:34px;display:grid;place-items:center;border-radius:50%;transition:.2s}
.wd.sel b{background:var(--primary);color:#fff;box-shadow:0 6px 14px rgba(94,92,230,.35)}
.wd.today:not(.sel) b{color:var(--primary);box-shadow:inset 0 0 0 2px var(--primary)}
.wd i{width:5px;height:5px;border-radius:50%}.wd i.has{background:#C9C7F5}.wd i.full{background:var(--green)}
.wrap{padding:0 16px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(28,27,41,.04),0 8px 24px rgba(94,92,230,.06);margin-bottom:12px}
.day-card{position:relative;cursor:pointer;margin-top:4px}
.dc-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub);font-weight:600}
.dc-phase{background:var(--primary-soft);color:var(--primary);padding:3px 9px;border-radius:999px;font-weight:700;font-size:11.5px}
.dc-head{font-size:18px;font-weight:800;margin-top:8px;line-height:1.35;padding-right:24px}
.dc-head.muted{color:#B5B3C8;font-weight:600;font-size:16px}
.dc-body{font-size:14px;color:var(--sub);margin-top:4px;line-height:1.5}
.dc-prog{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12.5px;color:var(--sub);font-weight:600;white-space:nowrap}
.pbar{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.pbar>span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#A78BFA);border-radius:9px;transition:width .5s}
.dc-edit{position:absolute;right:14px;top:40px;color:#C4C2D6}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:600}
.chip svg{color:var(--primary)}
.chip:active{transform:scale(.97)}
.toolbar{display:flex;justify-content:space-between;align-items:center;padding:0 16px 12px;gap:8px}
.seg{display:inline-flex;background:#E9E7F3;padding:3px;border-radius:12px}
.seg button{border:0;background:none;padding:7px 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);display:flex;gap:5px;align-items:center;white-space:nowrap}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.sm button{padding:7px 9px;font-size:12.5px}
.seg.full{display:flex;width:100%}.seg.full button{flex:1;justify-content:center;padding:9px}
#taskArea{padding:0 16px}
.sec-lbl{font-size:12px;font-weight:700;color:var(--sub);margin:6px 2px 8px;letter-spacing:.2px}
.task{display:flex;align-items:flex-start;gap:12px;background:#fff;border-radius:16px;padding:14px 14px 14px 16px;margin-bottom:10px;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(28,27,41,.04),0 6px 18px rgba(94,92,230,.05);transition:opacity .2s}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #CFCDE0;background:#fff;display:grid;place-items:center;color:transparent;margin-top:1px;transition:.2s}
.task.done .chk{background:var(--green);border-color:var(--green);color:#fff}
.task.done{opacity:.7}
.task.done .t-title{text-decoration:line-through;color:var(--sub)}
.t-main{flex:1;min-width:0;cursor:pointer}
.t-title{font-size:15px;font-weight:600;line-height:1.4}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12px;color:var(--sub);align-items:center}
.cat{padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);font-weight:700;font-size:11px}
.tag{padding:2px 7px;border-radius:6px;background:#F1F0F7;font-weight:700;font-size:11px;display:inline-flex;gap:3px;align-items:center}
.tag.ok{background:#E7F8F1;color:var(--green)}
.warn{color:var(--red);font-weight:700;display:inline-flex;gap:3px;align-items:center}
.note-ic{color:#B5B3C8}
.evt-row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;margin-bottom:10px;background:repeating-linear-gradient(135deg,#F3F2F8 0 8px,#EEEDF5 8px 16px);color:var(--sub);font-size:13px;cursor:pointer}
.evt-row b{display:block;color:var(--text);font-weight:600;font-size:14px}
.empty{text-align:center;padding:36px 20px;color:var(--sub)}
.empty .big{font-size:40px;margin-bottom:8px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.empty .btn-row{max-width:320px;margin:16px auto 0}
.tray{background:#fff;border-radius:16px;padding:12px;margin-bottom:12px}
.tray-list{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tray-it{flex:none;max-width:220px;text-align:left;border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);padding:8px 10px;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray-it small{display:block;color:var(--sub);font-weight:500}
.link-btn{border:0;background:none;color:var(--primary);font-weight:700;font-size:13px;margin-top:10px;padding:2px;display:inline-flex;gap:4px;align-items:center}
.link-btn.danger{color:var(--red)}
.tl{background:#fff;border-radius:var(--r);padding:12px 8px 12px 0}
.tl-inner{position:relative}
.hr{position:absolute;left:46px;right:0;border-top:1px solid var(--line)}
.hr span{position:absolute;left:-42px;top:-8px;font-size:11px;color:var(--sub);font-weight:600}
.blk{position:absolute;border-radius:10px;padding:5px 8px;font-size:12px;overflow:hidden;background:color-mix(in srgb,var(--c) 16%,#fff);border-left:3px solid var(--c);touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;transition:box-shadow .15s,transform .15s}
.blk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk small{color:var(--sub);font-weight:600}
.blk.done{opacity:.5}
.blk.conf{box-shadow:inset 0 0 0 1.5px var(--red)}
.blk.drag{z-index:6;box-shadow:0 12px 28px rgba(0,0,0,.2);transform:scale(1.03);cursor:grabbing;transition:none}
.blk.evt{background:repeating-linear-gradient(135deg,#F3F2F8 0 6px,#ECEAF3 6px 12px);border-left-color:#A9A7BD;cursor:pointer}
.now{position:absolute;left:46px;right:0;border-top:2px solid var(--red);z-index:4;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.hint{font-size:12.5px;color:var(--sub);margin-top:8px;line-height:1.55}
.center{text-align:center}
.fab{position:fixed;right:max(16px,calc(50vw - 240px + 16px));bottom:calc(var(--nav-h) + var(--safe-b) + 16px);width:58px;height:58px;border-radius:20px;background:var(--primary);color:#fff;box-shadow:0 12px 28px rgba(94,92,230,.45);border:0;display:grid;place-items:center;z-index:30;transition:transform .15s}
.fab:active{transform:scale(.92)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:40}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:#A3A1B8}
.nav button.on{color:var(--primary)}
.composer{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b));left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:10px 12px;background:rgba(246,245,251,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;gap:8px;align-items:flex-end;z-index:35;border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:20px;padding:10px 14px;font-size:16px;max-height:120px;outline:none;background:#fff;line-height:1.4}
.composer textarea:focus{border-color:var(--primary)}
.composer button{width:44px;height:44px;border-radius:50%;border:0;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}
.composer button:disabled{opacity:.4}
.backdrop{position:fixed;inset:0;background:rgba(20,18,40,.38);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:#fff;border-radius:24px 24px 0 0;padding:8px 18px calc(22px + var(--safe-b));z-index:60;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:3px;background:#DDDBEA;margin:4px auto 12px}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.sh-head h3{font-size:19px;font-weight:800}
label.f{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--sub);margin:14px 0 6px}
.mini{border:0;background:none;color:var(--primary);font-size:12px;font-weight:700}
.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;background:#FAFAFE;outline:none;-webkit-appearance:none;appearance:none}
.in:focus{border-color:var(--primary);background:#fff}
textarea.in{resize:vertical;line-height:1.45}
select.in{background-image:linear-gradient(45deg,transparent 50%,#999 50%),linear-gradient(135deg,#999 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:14px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.pick button.on{border-color:var(--c,var(--primary));background:color-mix(in srgb,var(--c,var(--primary)) 12%,#fff);color:var(--c,var(--primary))}
.pick.sm{margin-top:8px}.pick.sm button{padding:5px 10px;font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dur{display:flex;align-items:center;gap:5px}
.dur .in{padding:11px 6px;text-align:center}
.dur span{font-size:12.5px;color:var(--sub);flex:none}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:15.5px;font-weight:700;background:var(--primary);color:#fff;display:flex;justify-content:center;align-items:center;gap:8px;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--primary-soft);color:var(--primary)}
.btn.danger{background:#FEECEC;color:var(--red)}
.btn.sm{padding:10px;font-size:14px;border-radius:12px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn-row.three{grid-template-columns:1fr 1fr 1fr}
.btn-row.three .btn{font-size:13.5px;padding:12px 6px}
.sync-row{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--green);font-weight:700;margin-top:14px;background:#E7F8F1;padding:9px 12px;border-radius:12px}
.sync-row .mini{margin-left:auto}
.opt{width:100%;display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:#F7F6FC;border:0;margin-bottom:8px;text-align:left;font-size:15px;text-decoration:none;color:var(--text);cursor:pointer}
.opt svg{color:var(--primary);flex:none}
.opt b{display:block;font-weight:700}
.opt small{display:block;color:var(--sub);font-size:12.5px;margin-top:2px;font-weight:500}
.opt.danger,.opt.danger svg{color:var(--red)}
.paste{border-radius:14px;padding:2px 0 8px}
.paste.hl{background:var(--primary-soft);padding:2px 12px 12px;margin-bottom:8px}
.prev{margin-top:14px;background:#F7F6FC;border-radius:14px;padding:12px;font-size:13.5px}
.prev-h{font-weight:700;margin-bottom:8px}
.prev-d{margin-bottom:8px}.prev-d small{color:var(--sub)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.mgrid.head span{font-size:12px;color:var(--sub);font-weight:700;padding:4px 0}
.mc{border:0;background:none;height:44px;border-radius:12px;font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.mc i{width:5px;height:5px;border-radius:50%}.mc i.has{background:#C9C7F5}.mc i.full{background:var(--green)}
.mc.today{color:var(--primary);box-shadow:inset 0 0 0 2px var(--primary)}
.mc.sel{background:var(--primary);color:#fff}.mc.sel i.has{background:#fff}
.hero{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.ring-w{position:relative;width:120px;height:120px}
.ring-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-t b{font-size:26px;font-weight:800}.ring-t small{font-size:11.5px;color:var(--sub);font-weight:600}
.stat{padding:6px 0;border-bottom:1px solid var(--line)}.stat:last-child{border:0}
.stat b{font-size:17px;font-weight:800}.stat small{display:block;font-size:12px;color:var(--sub);font-weight:600}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.card-h b{font-size:15px;font-weight:800}
.legend{display:flex;gap:8px;font-size:11px;color:var(--sub);align-items:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px}
.chart{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end}
.bar{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0}
.bar-track{position:relative;width:100%;height:110px;border-radius:6px;background:#F5F4FA}
.bar-plan{position:absolute;left:0;right:0;bottom:0;border-radius:6px;overflow:hidden}
.bar-fill{position:absolute;left:0;right:0;bottom:0;border-radius:6px}
.bar-v{font-size:9.5px;color:var(--sub);font-weight:700;height:12px}
.bar-d{font-size:11px;font-weight:700;color:var(--sub);width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.bar.sel .bar-d{background:var(--primary);color:#fff}
.cd-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.cd{background:#fff;border-radius:16px;padding:14px;box-shadow:0 6px 18px rgba(94,92,230,.05)}
.cd small{font-size:11.5px;color:var(--sub);font-weight:700;display:block}
.cd b{font-size:24px;font-weight:800;color:var(--primary);display:block;margin:4px 0 2px;letter-spacing:-.5px}
.cd span{font-size:11.5px;color:var(--sub)}
.sec-title{font-size:17px;font-weight:800;margin:20px 2px 10px}
details.phase{background:#fff;border-radius:16px;margin-bottom:10px;box-shadow:0 6px 18px rgba(94,92,230,.05);overflow:hidden}
details.phase summary{list-style:none;padding:14px 16px;cursor:pointer}
details.phase summary::-webkit-details-marker{display:none}
details.phase.cur{box-shadow:0 0 0 2px var(--primary),0 10px 24px rgba(94,92,230,.15)}
.ph-badge{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.3px}
.cur .ph-badge{color:var(--primary)}
.ph-title{font-size:15px;font-weight:800;margin:3px 0}
.ph-date{font-size:12px;color:var(--sub);font-weight:600}
.ph-body{padding:0 16px 14px;font-size:13.5px;line-height:1.7;color:#4A4860}
.milestone{display:inline-block;margin-top:8px;background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:12.5px;padding:6px 10px;border-radius:10px}
.ph-prog{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--sub);font-weight:600;margin-top:8px}
.ai-pad{padding-bottom:96px}
.ctx{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);background:#fff;border-radius:12px;padding:9px 12px;margin-bottom:12px}
.model-tag{margin-left:auto;background:#F1F0F7;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700}
.msgs{display:flex;flex-direction:column}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.55;margin:4px 0;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:#fff;border-bottom-left-radius:6px;box-shadow:0 2px 8px rgba(94,92,230,.06)}
.msg.err{background:#FEECEC;color:#B42318}
.typing{display:flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:#C4C2D6;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.prop{margin-top:10px;background:#F7F6FC;border-radius:14px;padding:12px;white-space:normal}
.prop-h{font-size:11.5px;font-weight:800;color:var(--primary);letter-spacing:.3px;margin-bottom:4px}
.prop ul{list-style:none;margin-top:6px;font-size:13.5px}
.prop li{padding:5px 0;border-bottom:1px dashed var(--line)}
.prop li small{color:var(--sub)}
.applied{margin-top:8px;color:var(--green);font-weight:700;font-size:13.5px}
.welcome{text-align:center;padding:24px 12px 8px;color:var(--sub);font-size:14px;line-height:1.6}
.welcome .big{font-size:42px}

const parseISO=s=>{if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const same=(a,b)=>a.getTime()===b.getTime();
const toMin=t=>{if(!t)return null;const[h,m]=String(t).split(':').map(Number);return h*60+(m||0)};
const fromMin=m=>pad(Math.floor(m/60)%24)+':'+pad(Math.round(m%60));

const normK=v=>{if(!v)return null;v=String(v);if(/^d_\d{8}$/.test(v))return v;const m=v.match(/(\d{4})-?(\d{2})-?(\d{2})/);return m?`d_${m[1]}${m[2]}${m[3]}`:null};
function dl(text,name,type){

function normTask(o,extra){
  let text=String(o.text||o.title||'').trim(),cat=o.cat||'';
  const m=text.match(/^\s*\[([^\]]+)\]\s*/);
  if(m){cat=cat||m[1];text=text.slice(m[0].length)}
  let h=Math.max(0,+o.durH||0),mm=Math.max(0,+o.durM||0);h+=Math.floor(mm/60);mm%=60;
  return {id:o.id||uid(),text,cat:cat||'อื่นๆ',time:/^\d{1,2}:\d{2}$/.test(o.time||'')?o.time.padStart(5,'0'):'',durH:h,durM:mm,done:!!o.done,note:o.note||'',extra:o.extra??extra,appleSynced:!!o.appleSynced,rolledFrom:normK(o.rolledFrom)||''};
}
function seedDays(){
  const days={};
  for(const [k,[hd,bd,tasks,extras=[]]] of Object.entries(SEED)){
    const mk=(a,ex)=>({id:a[0],cat:a[1],text:a[2],time:a[3],durH:a[4],durM:a[5],done:false,note:'',extra:ex,appleSynced:false,rolledFrom:''});
    days['d_'+k]={head:hd,body:bd,tasks:[...tasks.map(a=>mk(a,false)),...extras.map(a=>mk(a,true))]};
  }
  return days;
}
function migrate(src){
  const days={};
  src=src?.userSchedule||src?.days||src;
  if(!src||typeof src!=='object')return null;
  for(const k in src){
    if(!/^d_\d{8}$/.test(k))continue;
    const v=src[k]||{};
    days[k]={head:v.head||'',body:v.body||'',tasks:[...(v.tasks||[]).map(x=>normTask(x,!!x.extra)),...(v.extraTasks||[]).map(x=>normTask(x,true))]};
  }
  return Object.keys(days).length?{days}:null;
}
function migrateCal(raw){
  const out={};
  const put=(k,e)=>{
    if(!e||typeof e!=='object')return;
    const st=String(e.start||e.s||''),en=String(e.end||e.e||'');
    if(!/^\d{1,2}:\d{2}/.test(st))return;
    k=normK(k)||normK(e.d||e.date);if(!k)return;
    const s5=st.slice(0,5).replace(/^(\d):/,'0$1:');
    const e5=/^\d{1,2}:\d{2}/.test(en)?en.slice(0,5).replace(/^(\d):/,'0$1:'):fromMin(Math.min(toMin(s5)+60,1439));
    (out[k]=out[k]||[]).push({title:String(e.title||e.t||'นัดหมาย'),start:s5,end:e5});
  };
  if(Array.isArray(raw))raw.forEach(e=>put(null,e));
  else if(raw&&typeof raw==='object')for(const k in raw)(Array.isArray(raw[k])?raw[k]:[]).forEach(e=>put(k,e));
  return out;
}

function conflicts(k){
  const d=day(k),set=new Set();
  const iv=d.tasks.filter(t=>t.time).map(t=>({id:t.id,s:toMin(t.time),e:toMin(t.time)+Math.max(dur(t),15)}));
  const ev=(CAL[k]||[]).map(e=>({s:toMin(e.start),e:toMin(e.end)}));
  iv.forEach((a,i)=>{
    iv.slice(i+1).forEach(b=>{if(a.s<b.e&&b.s<a.e){set.add(a.id);set.add(b.id)}});
    ev.forEach(b=>{if(a.s<b.e&&b.s<a.e)set.add(a.id)});
  });
  return set;
}

function listHtml(k,list,conf){
  const timed=list.filter(t=>t.time).map(t=>({s:toMin(t.time),h:rowHtml(t,conf)}));

  let h='';
  if(all.length)h+=`<div class="sec-lbl">ตามเวลา</div>`+all.map(x=>x.h).join('');
  if(un.length)h+=`<div class="sec-lbl" style="margin-top:16px">ยังไม่กำหนดเวลา · ${un.length}</div>`+un.map(t=>rowHtml(t,conf)).join('')+`<button class="link-btn" data-day="auto">${I('zap',14)} จัดเวลาให้อัตโนมัติ</button>`;

function layout(items){
  items.sort((a,b)=>a.s-b.s||b.e-a.e);
  let cluster=[],cEnd=-1,ends=[];
  const flush=()=>{const n=Math.max(...cluster.map(x=>x.lane))+1;cluster.forEach(x=>x.n=n);cluster=[];ends=[]};
  for(const it of items){
    if(cluster.length&&it.s>=cEnd){flush();cEnd=-1}
    let l=ends.findIndex(e=>e<=it.s);
    if(l<0){l=ends.length;ends.push(it.e)}else ends[l]=it.e;
    it.lane=l;cluster.push(it);cEnd=Math.max(cEnd,it.e);
  }
  if(cluster.length)flush();
}
let GS=6;
function gridHtml(k,list,conf){
  const evs=filter==='all'?(CAL[k]||[]):[];
  const timed=list.filter(t=>t.time),un=list.filter(t=>!t.time);
  GS=6;timed.forEach(t=>GS=Math.min(GS,Math.floor(toMin(t.time)/60)));evs.forEach(e=>GS=Math.min(GS,Math.floor(toMin(e.start)/60)));
  const items=[...timed.map(t=>({t,s:toMin(t.time),e:toMin(t.time)+Math.max(dur(t),20)})),...evs.map((ev,i)=>({ev,i,s:toMin(ev.start),e:Math.max(toMin(ev.end),toMin(ev.start)+20)}))];
  layout(items);
  let h='';
  if(un.length)h+=`<div class="tray"><div class="sec-lbl" style="margin-top:0">ยังไม่กำหนดเวลา · ${un.length}</div><div class="tray-list">${un.map(t=>`<button class="tray-it" style="--c:${color(t.cat)}" data-act="open" data-id="${t.id}">${esc(t.text)}<small>${fmtDur(dur(t))}</small></button>`).join('')}</div><button class="link-btn" data-day="auto">${I('zap',14)} จัดเวลาให้อัตโนมัติ</button></div>`;
  h+=`<div class="tl"><div class="tl-inner" style="height:${(24-GS)*HH}px">`;
  for(let hr=GS;hr<=24;hr++)h+=`<div class="hr" style="top:${(hr-GS)*HH}px"><span>${pad(hr%24)}:00</span></div>`;
  items.forEach(it=>{
    const top=(it.s-GS*60)/60*HH,ht=Math.max((it.e-it.s)/60*HH-2,22);
    const pos=`top:${top}px;height:${ht}px;left:calc(50px + (100% - 54px) * ${it.lane} / ${it.n});width:calc((100% - 54px) / ${it.n} - 3px)`;
    if(it.ev)h+=`<div class="blk evt" style="${pos}" data-act="evt" data-i="${it.i}"><b>${esc(it.ev.title)}</b><small>${it.ev.start}–${it.ev.end}</small></div>`;
    else{const t=it.t;h+=`<div class="blk ${t.done?'done':''} ${conf.has(t.id)?'conf':''}" style="--c:${color(t.cat)};${pos}" data-id="${t.id}"><b>${t.done?'✓ ':''}${esc(t.text)}</b><small>${t.time}–${fromMin(toMin(t.time)+dur(t))}</small></div>`}
  });
  if(same(cur,today0())&&nowMin()>=GS*60)h+=`<div class="now" style="top:${(nowMin()-GS*60)/60*HH}px"></div>`;
  return h+`</div></div><p class="hint center">แตะเพื่อแก้ไข · กดค้างแล้วลากเพื่อย้ายเวลา (ทีละ 15 นาที)</p>`;
}
function bindDrag(k){
  $$('#taskArea .blk[data-id]').forEach(el=>{
    const id=el.dataset.id;
    let sy=0,timer=null,dragging=false,moved=false,orig=0,nm=0;
    const begin=y=>{sy=y;moved=false;dragging=false;const t=findTask(k,id);orig=nm=toMin(t?.time)||0};
    const startDrag=()=>{dragging=true;DRAG=true;el.classList.add('drag');haptic()};
    const move=y=>{
      const dy=y-sy;
      if(!dragging){if(Math.abs(dy)>8){clearTimeout(timer);moved=true}return false}
      if(Math.abs(dy)>3)moved=true;
      nm=Math.min(Math.max(Math.round((orig+dy/HH*60)/15)*15,GS*60),24*60-15);
      el.style.top=((nm-GS*60)/60*HH)+'px';
      el.querySelector('small').textContent=fromMin(nm)+' →';
      return true;
    };
    const finish=tap=>{
      clearTimeout(timer);
      const was=dragging;dragging=false;DRAG=false;el.classList.remove('drag');
      if(was&&moved&&nm!==orig){
        snapshot();const t=findTask(k,id);t.time=fromMin(nm);t.appleSynced=false;save();renderToday();toast(`ย้ายไป ${fromMin(nm)}`,true);
      }else if(!moved&&tap)openTask(id);
      else if(was)renderToday();
    };
    el.addEventListener('touchstart',e=>{if(e.touches.length>1)return;begin(e.touches[0].clientY);timer=setTimeout(startDrag,300)},{passive:true});
    el.addEventListener('touchmove',e=>{if(move(e.touches[0].clientY)&&e.cancelable)e.preventDefault()},{passive:false});
    el.addEventListener('touchend',e=>{if(e.cancelable)e.preventDefault();finish(true)});
    el.addEventListener('touchcancel',()=>finish(false));
    el.addEventListener('mousedown',e=>{
      if(e.button!==0)return;
      begin(e.clientY);startDrag();
      const mm=ev=>move(ev.clientY);
      const mu=()=>{document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);finish(true)};
      document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
    });
  });
}

/* ---- task actions ---- */
function toggle(id){
  const k=keyOf(cur),t=findTask(k,id);if(!t)return;
  t.done=!t.done;save();haptic();renderToday();
  if(t.done&&day(k).tasks.every(x=>x.done))toast('เยี่ยมมาก! ครบทุกงานของวันนี้ 🎉');
}
function moveTask(k,id,toK,roll){
  if(k===toK)return;
  const d=day(k),i=d.tasks.findIndex(t=>t.id===id);if(i<0)return;
  const [t]=d.tasks.splice(i,1);
  if(roll){t.done=false;t.rolledFrom=t.rolledFrom||k}
  t.appleSynced=false;
  ensureDay(toK).tasks.push(t);
}
function autoSchedule(){
  const k=keyOf(cur),d=day(k);
  const evBusy=(CAL[k]||[]).map(e=>({s:toMin(e.start),e:toMin(e.end)}));
  const fixed=[],toPlace=[];
  d.tasks.filter(t=>t.time).sort((a,b)=>toMin(a.time)-toMin(b.time)).forEach(t=>{
    const s=toMin(t.time),e=s+Math.max(dur(t),15);
    const hit=[...evBusy,...fixed].some(b=>s<b.e&&b.s<e);
    if(hit&&!t.done)toPlace.push(t);else fixed.push({s,e});
  });
  const un=d.tasks.filter(t=>!t.time&&!t.done).sort((a,b)=>a.extra-b.extra);
  const queue=[...toPlace,...un];
  if(!queue.length){toast('ตารางวันนี้เรียบร้อยแล้ว ไม่มีอะไรต้องจัด');return}
  snapshot();
  const all=[{s:720,e:780},...evBusy,...fixed];
  let startMin=480;if(same(cur,today0()))startMin=Math.max(480,Math.ceil((nowMin()+5)/15)*15);
  let placed=0;
  queue.forEach(t=>{
    if(!dur(t))t.durH=1;
    const len=dur(t);
    for(let s=startMin;s+len<=22*60;s+=15){
      if(!all.some(b=>s<b.e+10&&b.s<s+len+10)){t.time=fromMin(s);t.appleSynced=false;all.push({s,e:s+len});placed++;return}
    }
    if(toPlace.includes(t)){t.time='';t.appleSynced=false}
  });
  save();renderToday();
  toast(placed===queue.length?`จัดเวลาให้ ${placed} งานแล้ว`:`จัดได้ ${placed}/${queue.length} งาน (เวลาว่างไม่พอ)`,true);
}
function rollover(){
  const k=keyOf(cur),left=day(k).tasks.filter(t=>!t.done);
  if(!left.length){toast('ไม่มีงานค้าง เก่งมาก!');return}
  snapshot();
  const nk=keyOf(addDays(cur,1));

function parseDateAny(v){
  const mk=(y,mo,d)=>{if(y>2400)y-=543;const x=new Date(y,mo-1,d);return isNaN(x)||x.getDate()!==d?null:x};
  if(v instanceof Date&&!isNaN(v))return new Date(v.getFullYear(),v.getMonth(),v.getDate());
  if(typeof v==='number'&&v>20000){const d=new Date(Math.round((v-25569)*864e5));return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())}
  const s=String(v||'').trim();let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(m)return mk(+m[1],+m[2],+m[3]);
  m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);if(m)return mk(+m[3],+m[2],+m[1]);
  return null;
}
function mkRow(date,task,hours,cat){
  const d=parseDateAny(date);if(!d||!String(task||'').trim())return null;
  let text=String(task).trim(),c=String(cat||'').trim();
  const m=text.match(/^\[([^\]]+)\]\s*/);if(m){c=c||m[1];text=text.slice(m[0].length)}
  const found=CATS.find(x=>x.toLowerCase()===c.toLowerCase());
  const hrs=parseFloat(String(hours??'').replace(',','.'));
  return {k:keyOf(d),text,cat:found||c||'อื่นๆ',mins:isNaN(hrs)?60:Math.round(hrs*60)};
}
function parseBulk(text){
  const rows=[],bad=[];
  text.replace(/^\uFEFF/,'').split(/\r?\n/).forEach(line=>{
    const L=line.trim();if(!L)return;
    const p=(L.includes('|')?L.split('|'):L.includes('\t')?L.split('\t'):L.split(',')).map(s=>s.trim());
    const r=mkRow(p[0],p[1],p[2],p[3]);
    if(r)rows.push(r);else if(!/date|วันที่/i.test(L))bad.push(L);
  });
  return {rows,bad};
}
async function readFile(f){
  const name=f.name.toLowerCase();
  if(/\.(csv|txt)$/.test(name)){
    const txt=await f.text();
    if(txt.includes('|')||!window.XLSX)return parseBulk(txt);
    return fromSheet(XLSX.read(txt.replace(/^\uFEFF/,''),{type:'string',cellDates:true}));
  }
  if(!window.XLSX)throw new Error('โหลดตัวอ่าน Excel ไม่ได้ (ต้องต่ออินเทอร์เน็ต)');
  return fromSheet(XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true}));
}
function fromSheet(wb){
  const json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  const rows=[],bad=[];
  json.forEach((o,i)=>{
    const g=re=>{const kk=Object.keys(o).find(x=>re.test(x.trim()));return kk?o[kk]:''};
    const r=mkRow(g(/^(date|วันที่|วัน)$/i),g(/^(task|งาน|title|ชื่องาน)$/i),g(/^(hours?|ชั่วโมง|ชม\.?)$/i),g(/^(category|cat|หมวด|หมวดหมู่)$/i));
    r?rows.push(r):bad.push('แถว '+(i+2));
  });
  return {rows,bad};
}

const utcStr=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\r?\n/g,'\\n');
function icsFor(list){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//KyotoPlan//TH','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  const stamp=utcStr(new Date());
  list.forEach(({k,t})=>{
    const d=dateOf(k),[h,m]=t.time.split(':').map(Number);
    const s=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m);
    const e=new Date(s.getTime()+Math.max(dur(t),15)*6e4);
    L.push('BEGIN:VEVENT',`UID:${t.id}-${k}@kyotoplan`,`DTSTAMP:${stamp}`,`DTSTART:${utcStr(s)}`,`DTEND:${utcStr(e)}`,`SUMMARY:${icsEsc(`[${t.cat}] ${t.text}`)}`);
    if(t.note)L.push(`DESCRIPTION:${icsEsc(t.note)}`);
    L.push('BEGIN:VALARM','TRIGGER:-PT10M','ACTION:DISPLAY','DESCRIPTION:Reminder','END:VALARM','END:VEVENT');
  });
  L.push('END:VCALENDAR');return L.join('\r\n');
}
function downloadICS(text,name){
  if(isIOS()){location.href=URL.createObjectURL(new Blob([text],{type:'text/calendar'}));return}
  dl(text,`kyoto-${name}.ics`,'text/calendar;charset=utf-8');
}
function parseCalText(text,defK){
  const out={};
  text.split(/\r?\n/).forEach(line=>{
    const L=line.trim();if(!L)return;
    let k=defK;const dm=L.match(/(\d{4})-(\d{2})-(\d{2})/);if(dm)k=`d_${dm[1]}${dm[2]}${dm[3]}`;
    const times=[...L.matchAll(/(\d{1,2})[:.](\d{2})/g)].map(m=>+m[1]*60+ +m[2]).filter(x=>x<1440);
    if(!times.length)return;
    const s=times[0],e=times[1]>s?times[1]:s+60;
    const title=L.replace(/\d{4}-\d{2}-\d{2}/g,'').replace(/\d{1,2}[:.]\d{2}\s*(น\.|AM|PM|am|pm)?/g,'').replace(/[|,\t]+/g,' ').replace(/\s[-–]\s/g,' ').replace(/\s+/g,' ').trim().replace(/^[-–:]+|[-–:]+$/g,'').trim()||'นัดหมาย';
    (out[k]=out[k]||[]).push({title,start:fromMin(s),end:fromMin(Math.min(e,1439))});
  });
  return out;
}
function importCal(text,defK){
  const parsed=parseCalText(text,defK);let added=0,matched=0;
  const norm=s=>s.replace(/\[[^\]]*\]/g,'').trim().toLowerCase();
  for(const k in parsed){
    const d=day(k),evs=[];
    parsed[k].forEach(ev=>{
      const t=d.tasks.find(t=>norm(t.text)===norm(ev.title));
      if(t){t.time=ev.start;const m=Math.max(toMin(ev.end)-toMin(ev.start),15);t.durH=Math.floor(m/60);t.durM=m%60;t.appleSynced=true;matched++}
      else{evs.push(ev);added++}
    });
    CAL[k]=evs;
  }
  save();saveCal();return {added,matched,days:Object.keys(parsed).length};
}

async function askGemini(){
  const key=localStorage.getItem(LS.key),model=getModel();
  const hist=CHAT.filter(m=>!m.err).slice(-12);while(hist.length&&hist[0].role!=='user')hist.shift();
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({systemInstruction:{parts:[{text:sysPrompt()}]},contents:hist.map(m=>({role:m.role,parts:[{text:m.text}]})),generationConfig:{responseMimeType:'application/json',temperature:.7}})
  });
  if(!res.ok){let msg='';try{msg=(await res.json()).error?.message||''}catch{}const e=new Error(msg);e.status=res.status;throw e}
  const j=await res.json();
  return parseAI((j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join(''));
}
function errMsg(e){
  if(e.status===400&&/key/i.test(e.message))return 'API Key ไม่ถูกต้อง ลองตรวจสอบในแท็บตั้งค่า';
  if(e.status===403)return 'API Key ไม่มีสิทธิ์ใช้งาน ลองสร้าง Key ใหม่';
  if(e.status===404)return `ไม่พบโมเดล "${getModel()}" ไปที่แท็บตั้งค่า กด "ทดสอบ Key" เพื่อโหลดรายชื่อโมเดลที่ใช้ได้`;
  if(e.status===429)return 'ใช้งานเกินโควตาชั่วคราว รอสักครู่แล้วลองใหม่';
  if(!e.status)return 'เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่';
  return `เกิดข้อผิดพลาด (${e.status}) ${e.message||''}`;
}
async function send(text){
  text=(text??$('#chatIn').value).trim();if(!text||BUSY)return;

  $('#chatIn').value='';$('#chatIn').style.height='';
  CHAT.push({role:'user',text});BUSY=true;renderAI();
  try{
    const o=await askGemini();
    const m={role:'model',text:o.reply||'',k:keyOf(cur)};
    if(o.shouldUpdatePlan&&Array.isArray(o.proposedTasks)&&o.proposedTasks.length)m.proposal={head:o.proposedHead||'',body:o.proposedBody||'',tasks:o.proposedTasks};
    CHAT.push(m);
  }catch(e){CHAT.push({role:'model',text:errMsg(e),err:true})}
  BUSY=false;saveChat();renderAI();
}
function applyProposal(i,mode){
  const m=CHAT[i];if(!m?.proposal)return;
  snapshot();
  const d=ensureDay(m.k),old=d.tasks;
  const prop=m.proposal.tasks.map(x=>normTask({...x,id:null,done:false,note:'',appleSynced:false,rolledFrom:''},false));
  let n=prop.length;
  if(mode==='replace'){
    prop.forEach(t=>{const o=old.find(o=>!o.extra&&o.text===t.text);if(o){t.id=o.id;t.done=o.done;t.note=o.note;t.rolledFrom=o.rolledFrom;t.appleSynced=o.appleSynced&&o.time===t.time&&dur(o)===dur(t)}});
    d.tasks=[...prop,...old.filter(t=>t.extra)];
    if(m.proposal.head)d.head=m.proposal.head;if(m.proposal.body)d.body=m.proposal.body;
  }else{
    const ex=new Set(old.map(t=>t.text));const add=prop.filter(t=>!ex.has(t.text));n=add.length;
    d.tasks.push(...add);
  }
  m.applied=mode;m.appliedN=n;save();saveChat();renderAI();
  toast(mode==='replace'?`แทนที่แผน ${short(dateOf(m.k))} แล้ว`:`เพิ่ม ${n} งานต่อท้ายแล้ว`,true);
}

     <label class="f">API Key</label><div class="row"><input id="sKey" class="in" type="password" value="${esc(key)}" placeholder="AIza…"><button class="icon-btn" id="sEye">${I('eye',16)}</button></div>
     <div class="btn-row"><button class="btn ghost sm" id="sTest">ทดสอบ Key</button><button class="btn danger sm" id="sClearKey">ลบ Key</button></div>
     <label class="f">โมเดล</label><select id="sModel" class="in">${list.map(m=>`<option ${m===model?'selected':''}>${esc(m)}</option>`).join('')}<option value="__c" ${custom?'selected':''}>กำหนดเอง…</option></select>
     <input id="sModelC" class="in" style="margin-top:8px;${custom?'':'display:none'}" value="${custom?esc(model):''}" placeholder="ชื่อโมเดล เช่น gemini-2.5-pro">
     <button class="btn" id="sSaveAI" style="margin-top:12px">บันทึก</button>
     <p class="hint">กด "ทดสอบ Key" เพื่อตรวจว่า Key ใช้ได้ และโหลดรายชื่อโมเดลที่ใช้ได้จริง · Key เก็บในเครื่องนี้เท่านั้น · <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">รับ Key ฟรี</a></p></div>
   <div class="card"><div class="set-title">${I('cal')} เชื่อมปฏิทิน Apple</div>
     <p class="hint">สร้าง Shortcut ชื่อ <b>KyotoCal</b> ให้ทำงานดังนี้: รับข้อความวันที่ → ค้นหา Calendar Events ของวันนั้น → จัดแต่ละรายการเป็น <code>ชื่อนัด | HH:MM | HH:MM</code> → คัดลอกไปยังคลิปบอร์ด → เปิดแอปนี้กลับมา</p>
     <p class="hint">ใช้งานจากปุ่ม “ปฏิทิน Apple” ในหน้าวันนี้ ถ้าอ่านคลิปบอร์ดอัตโนมัติไม่ได้ ระบบจะเปิดช่องให้วางเอง</p></div>
   <div class="card"><div class="set-title">${I('note')} ข้อมูล</div><div style="margin-top:10px"></div>
     <button class="opt" id="sBackup">${I('download',20)}<div><b>สำรองข้อมูล</b><small>ดาวน์โหลดไฟล์ .json</small></div></button>
     <label class="opt">${I('upload',20)}<div><b>กู้คืนจากไฟล์สำรอง</b><small>แทนที่ข้อมูลปัจจุบัน</small></div><input type="file" id="sRestore" accept=".json,application/json" hidden></label>
     <a class="opt" href="${SHEET}" target="_blank" rel="noopener">${I('ext',20)}<div><b>Google Sheet ฉบับเต็ม</b><small>เปิดในแท็บใหม่</small></div></a>
     <button class="opt danger" id="sReset">${I('trash',20)}<div><b>รีเซ็ตเป็นแผนเริ่มต้น</b><small>ลบงานและนัดทั้งหมด (Key ยังอยู่)</small></div></button></div>
   <p class="hint center" style="margin-bottom:12px">Kyoto Plan · v13.1</p>`;
  $('#sEye').onclick=()=>{const i=$('#sKey');i.type=i.type==='password'?'text':'password'};
  $('#sModel').onchange=()=>{$('#sModelC').style.display=$('#sModel').value==='__c'?'':'none'};
  $('#sSaveAI').onclick=()=>{
    const k=$('#sKey').value.trim();k?localStorage.setItem(LS.key,k):localStorage.removeItem(LS.key);
    const m=$('#sModel').value==='__c'?$('#sModelC').value.trim():$('#sModel').value;if(m)localStorage.setItem(LS.model,m);
    toast('บันทึกการตั้งค่าแล้ว');
  };
  $('#sClearKey').onclick=()=>confirmSheet('ลบ API Key?','โค้ช AI จะใช้งานไม่ได้จนกว่าจะใส่ Key ใหม่','ลบ Key',()=>{localStorage.removeItem(LS.key);localStorage.removeItem(LS.models);renderSettings();toast('ลบ Key แล้ว')},true);
  $('#sTest').onclick=async()=>{
    const k=$('#sKey').value.trim();if(!k){toast('ใส่ Key ก่อน');return}
    const b=$('#sTest');b.disabled=true;b.textContent='กำลังตรวจสอบ…';
    try{
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=${encodeURIComponent(k)}`);
      const j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(j.error?.message||('HTTP '+r.status));
      const names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,'')).filter(n=>/gemini/i.test(n));
      names.sort((a,b)=>(/flash/.test(b)-/flash/.test(a))||b.localeCompare(a));
      localStorage.setItem(LS.key,k);
      if(names.length){localStorage.setItem(LS.models,JSON.stringify(names));if(!names.includes(getModel()))localStorage.setItem(LS.model,names[0])}
      renderSettings();toast(`Key ใช้ได้ · พบ ${names.length} โมเดล`);
    }catch(e){b.disabled=false;b.textContent='ทดสอบ Key';toast('Key ใช้ไม่ได้: '+(e.message||'เชื่อมต่อไม่ได้'))}
  };
  $('#sBackup').onclick=()=>dl(JSON.stringify({v:13,plan:S,cal:CAL},null,1),`kyoto-plan-backup-${iso(today0())}.json`,'application/json');
  $('#sRestore').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{const j=JSON.parse(await f.text());const plan=j.plan?.days?{days:migrate(j.plan.days)?.days||{}}:migrate(j);if(!plan||!Object.keys(plan.days).length)throw 0;
      confirmSheet('กู้คืนข้อมูล?','ข้อมูลปัจจุบันจะถูกแทนที่ด้วยไฟล์สำรอง','กู้คืน',()=>{snapshot();S=plan;CAL=migrateCal(j.cal||{});save();saveCal();refresh();toast('กู้คืนแล้ว',true)});
    }catch{toast('ไฟล์สำรองไม่ถูกต้อง')}
    e.target.value='';
  };
  $('#sReset').onclick=()=>confirmSheet('รีเซ็ตแผน?','งาน ความคืบหน้า และนัดที่นำเข้าทั้งหมดจะถูกลบ แล้วกลับไปเป็นแผนเริ่มต้น','รีเซ็ต',()=>{snapshot();S={days:seedDays()};CAL={};save();saveCal();refresh();toast('รีเซ็ตแล้ว',true)},true);
}

/* ================= NAV & EVENTS ================= */
function setTab(t){
  tab=t;
  $$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t));
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('#fab').style.display=t==='today'?'':'none';
  $('#composer').style.display=t==='ai'?'':'none';
  if(t!=='ai')window.scrollTo(0,0);
  refresh();
}
$('#nav').innerHTML=[['today','home','วันนี้'],['overview','chart','ภาพรวม'],['ai','sparkle','โค้ช AI'],['settings','gear','ตั้งค่า']].map(([t,ic,l])=>`<button data-t="${t}">${I(ic,22)}<span>${l}</span></button>`).join('');
$('#nav').onclick=e=>{const b=e.target.closest('[data-t]');if(b)setTab(b.dataset.t)};
$('#fab').innerHTML=I('plus',26,2.5);
$('#sendBtn').innerHTML=I('send',18);
$('#monthIc').innerHTML=I('chevD',18);
$('#prevW').innerHTML=I('chevL',16);$('#nextW').innerHTML=I('chevR',16);
$('#dayActions').innerHTML=`<button class="chip" data-day="auto">${I('zap',15)} จัดเวลาอัตโนมัติ</button><button class="chip" data-day="roll">${I('arrow',15)} ย้ายงานค้างไปพรุ่งนี้</button><button class="chip" data-day="cal">${I('cal',15)} ปฏิทิน Apple</button>`;

$('#fab').onclick=()=>openAdd();
$('#monthBtn').onclick=openMonth;
$('#todayBtn').onclick=()=>{cur=today0();renderToday()};
$('#prevW').onclick=()=>{cur=addDays(cur,-7);renderToday()};
$('#nextW').onclick=()=>{cur=addDays(cur,7);renderToday()};
$('#week').onclick=e=>{const b=e.target.closest('[data-k]');if(b){cur=dateOf(b.dataset.k);renderToday()}};
$('#dayCard').onclick=openDayEdit;
$('#dayActions').onclick=e=>{const b=e.target.closest('[data-day]');if(b)dayAction(b.dataset.day)};
$('#viewSeg').onclick=e=>{
  const b=e.target.closest('[data-v]');if(!b||b.dataset.v===view)return;view=b.dataset.v;renderToday();
  if(view==='grid'){const f=$('#taskArea .blk');if(f)window.scrollTo({top:f.getBoundingClientRect().top+scrollY-280,behavior:'smooth'})}
};
$('#filterSeg').onclick=e=>{const b=e.target.closest('[data-f]');if(b){filter=b.dataset.f;renderToday()}};
$('#taskArea').addEventListener('click',e=>{
  const a=e.target.closest('[data-act],[data-day]');if(!a)return;
  if(a.dataset.day)return dayAction(a.dataset.day);
  const id=a.dataset.id||a.closest('[data-id]')?.dataset.id;
  ({toggle:()=>toggle(id),open:()=>openTask(id),evt:()=>openEvt(+a.dataset.i),add:()=>openAdd(),ai:()=>setTab('ai'),
    first:()=>{const fk=firstKey();if(fk){cur=dateOf(fk);renderToday()}else toast('ยังไม่มีงานในแผน')}})[a.dataset.act]?.();
});
$('#bd').onclick=closeSheet;
$('#sheet').addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeSheet()});
$('#toastUndo').onclick=undo;
$('#clearChat').onclick=()=>{if(!CHAT.length)return;confirmSheet('ล้างแชตทั้งหมด?','ประวัติการคุยกับโค้ชจะหายไป (แผนไม่ถูกแก้)','ล้างแชต',()=>{CHAT=[];saveChat();renderAI()},true)};
$('#sendBtn').onclick=()=>send();
$('#chatIn').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'});
$('#chatIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&window.matchMedia('(hover:hover)').matches){e.preventDefault();send()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){checkCalWait();if(tab==='today'&&!DRAG)renderToday()}});
window.addEventListener('focus',checkCalWait);

/* ================= INIT ================= */
load();
setTab('today');
checkCalWait();
setInterval(()=>{if(tab==='today'&&view==='grid'&&!DRAG&&!$('#sheet').classList.contains('on'))renderToday()},60000);
</script>
</body>
</html>
